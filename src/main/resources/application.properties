spring.application.name=autocare

# Runs on 8081 so AutoCare and the CILE project (BookWise, port 8080) can be
# demonstrated side by side without a port clash.
server.port=8081

# ---------------------------------------------------------------------------
# Database - H2 in FILE mode so seeded data and jobs created through the UI
# survive a restart and match the database screenshots.
# H2 console JDBC URL: jdbc:h2:file:./data/autocare
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./data/autocare
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# JPA / Hibernate. open-in-view is off: the persistence context must not leak
# into the view layer, so every association a template needs is fetch-joined
# in the repository or flattened into a DTO by the service.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

server.error.whitelabel.enabled=false
spring.mvc.problemdetails.enabled=false
