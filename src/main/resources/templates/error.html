<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Problem')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="narrow-shell">

        <!--
          Fallback view for container-level errors (404s on unmapped URLs, and
          anything that escapes the @ControllerAdvice handlers). Without it,
          Spring Boot would answer an HTML request with a JSON error body it
          cannot render, producing a blank page.
        -->
        <div class="card shadow-sm border-secondary">
            <div class="card-body p-4">

                <span class="badge text-bg-secondary mb-3" th:text="${status} ?: 'Error'">Error</span>

                <h1 class="h4 mb-3" th:text="${error} ?: 'Something went wrong'">Something went wrong</h1>

                <p class="lead">The page you asked for could not be displayed.</p>

                <div class="d-flex gap-2 align-items-center">
                    <a class="btn btn-primary" th:href="@{/}">Return to AutoCare</a>
                    <span class="error-code ms-auto" th:text="${path}"></span>
                </div>

            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
