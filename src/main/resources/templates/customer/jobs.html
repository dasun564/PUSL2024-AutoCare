<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My service jobs')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h1 class="h3 mb-0">My service jobs</h1>
        <a class="btn btn-primary" th:href="@{/book}">Book a service</a>
    </div>

    <div th:replace="~{fragments/layout :: flash}"></div>
    <div th:replace="~{fragments/layout :: capacityBanner(${capacity})}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Job</th>
                    <th>Vehicle</th>
                    <th>Booked for</th>
                    <th>Status</th>
                    <th class="text-end">Invoice</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="job : ${jobs}">
                    <td class="job-number" th:text="${job.jobNumber()}">AC-0000</td>
                    <td>
                        <code th:text="${job.registrationNumber()}">REG</code>
                        <div class="small text-muted" th:text="${job.vehicleDescription()}">Make Model</div>
                    </td>
                    <td class="small" th:text="${#temporals.format(job.bookedFor(), 'd MMM yyyy')}">date</td>
                    <td>
                        <span th:replace="~{fragments/layout :: statusBadge(${job.status()})}"></span>
                    </td>
                    <td class="text-end money">
                        <span th:if="${job.grandTotal() != null}"
                              th:text="'LKR ' + ${#numbers.formatDecimal(job.grandTotal(), 1, 'COMMA', 2, 'POINT')}">
                        </span>
                        <span th:unless="${job.grandTotal() != null}" class="text-muted">-</span>
                    </td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-secondary"
                           th:href="@{/my-jobs/{id}(id=${job.id()})}">View</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(jobs)}">
                    <td colspan="6" class="text-center text-muted py-5">
                        You have no service jobs yet.
                        <a th:href="@{/book}">Book your first service</a>.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
