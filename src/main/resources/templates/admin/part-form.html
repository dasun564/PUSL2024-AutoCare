<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Part details')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="narrow-shell">

        <a class="btn btn-sm btn-link ps-0 mb-2" th:href="@{/admin/parts}">&larr; Back to inventory</a>

        <h1 class="h3 mb-3" th:text="${editing} ? 'Edit part' : 'Add a part'">Add a part</h1>

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <!--
                  Constraints are declared on PartForm and triggered by @Valid
                  in AdminPartController, so the same rules protect the REST
                  endpoint without being restated here.
                -->
                <form th:action="${editing}
                                 ? @{/admin/parts/{id}(id=${partForm.id})}
                                 : @{/admin/parts}"
                      th:object="${partForm}" method="post" novalidate>

                    <input type="hidden" th:field="*{id}">

                    <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                        Please correct the highlighted fields below.
                    </div>

                    <div class="row">
                        <div class="col-md-5 mb-3">
                            <label class="form-label" for="partNumber">Part number</label>
                            <input type="text" id="partNumber" class="form-control" th:field="*{partNumber}"
                                   placeholder="BR-PAD-FRT"
                                   th:classappend="${#fields.hasErrors('partNumber')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{partNumber}"></div>
                        </div>
                        <div class="col-md-7 mb-3">
                            <label class="form-label" for="name">Part name</label>
                            <input type="text" id="name" class="form-control" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="categoryId">Category</label>
                            <select id="categoryId" class="form-select" th:field="*{categoryId}"
                                    th:classappend="${#fields.hasErrors('categoryId')} ? 'is-invalid' : ''">
                                <option value="">Choose a category</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">Cat</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{categoryId}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="unitPrice">Unit price (LKR)</label>
                            <input type="number" step="0.01" id="unitPrice" class="form-control"
                                   th:field="*{unitPrice}"
                                   th:classappend="${#fields.hasErrors('unitPrice')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{unitPrice}"></div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label" for="stockQuantity">Opening stock</label>
                            <input type="number" id="stockQuantity" class="form-control"
                                   th:field="*{stockQuantity}" th:readonly="${editing}"
                                   th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{stockQuantity}"></div>
                            <div class="form-text" th:if="${editing}">
                                Change stock with the Count action on the inventory list.
                            </div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label" for="reorderLevel">Reorder level</label>
                            <input type="number" id="reorderLevel" class="form-control" th:field="*{reorderLevel}"
                                   th:classappend="${#fields.hasErrors('reorderLevel')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{reorderLevel}"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label" for="partType">Part type</label>

                            <select id="partType" class="form-select" th:if="${!editing}" th:field="*{partType}">
                                <option value="MECHANICAL">Mechanical</option>
                                <option value="CONSUMABLE">Consumable</option>
                            </select>

                            <!-- Fixed after creation: it selects the subclass table
                                 under the JOINED inheritance strategy. -->
                            <div th:if="${editing}">
                                <input type="text" class="form-control" readonly
                                       th:value="${partForm.partType == 'CONSUMABLE'} ? 'Consumable' : 'Mechanical'">
                                <input type="hidden" th:field="*{partType}">
                                <div class="form-text">Type cannot be changed after creation.</div>
                            </div>
                        </div>
                    </div>

                    <hr class="my-4">
                    <p class="text-muted small">Complete the section matching the type chosen above.</p>

                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label" for="shelfLifeMonths">Shelf life, months (consumable)</label>
                            <input type="number" id="shelfLifeMonths" class="form-control"
                                   th:field="*{shelfLifeMonths}" placeholder="36">
                        </div>
                        <div class="col-md-8 mb-3 d-flex align-items-end">
                            <div class="form-check">
                                <input type="checkbox" id="hazardous" class="form-check-input" th:field="*{hazardous}">
                                <label class="form-check-label" for="hazardous">
                                    Hazardous - requires controlled disposal
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-5 mb-3">
                            <label class="form-label" for="manufacturer">Manufacturer (mechanical)</label>
                            <input type="text" id="manufacturer" class="form-control" th:field="*{manufacturer}"
                                   placeholder="Bosch">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label class="form-label" for="warrantyMonths">Warranty, months</label>
                            <input type="number" id="warrantyMonths" class="form-control"
                                   th:field="*{warrantyMonths}" placeholder="24">
                        </div>
                        <div class="col-md-4 mb-3 d-flex align-items-end">
                            <div class="form-check">
                                <input type="checkbox" id="requiresSpecialistFitting" class="form-check-input"
                                       th:field="*{requiresSpecialistFitting}">
                                <label class="form-check-label" for="requiresSpecialistFitting">
                                    Specialist fitting
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-3">
                        <button class="btn btn-primary" type="submit"
                                th:text="${editing} ? 'Save changes' : 'Add part'">Add part</button>
                        <a class="btn btn-outline-secondary" th:href="@{/admin/parts}">Cancel</a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
